name: build
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: python -m pytest tests/ -v
  compile:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      # ponytail: factory image is zero-config (no secrets); keep a dummy file
      # only so local `!secret` experiments don't fail on missing file.
      - run: cp secrets.yaml.example secrets.yaml || true
      - run: pip install esphome
      - run: esphome config heatwhisper_esp32.yaml
      - run: esphome config heatwhisper_pico_w.yaml
      - run: esphome config heatwhisper_esp32_s3_rs485.yaml
      - run: esphome compile heatwhisper_esp32.yaml
      - run: esphome compile heatwhisper_pico_w.yaml
      - run: esphome compile heatwhisper_esp32_s3_rs485.yaml
      - run: |
          mkdir -p fw
          cp .esphome/build/heat-whisper/build/firmware.factory.bin fw/
          cp .esphome/build/heat-whisper/build/firmware.ota.bin fw/
          cp .esphome/build/heat-whisper-pico/.pioenvs/heat-whisper-pico/firmware.bin fw/
          cp .esphome/build/heat-whisper-pico/.pioenvs/heat-whisper-pico/firmware.uf2 fw/
      - run: |
          cp .esphome/build/heat-whisper-s3/build/firmware.factory.bin fw/heatwhisper_esp32_s3_rs485.factory.bin
          cp .esphome/build/heat-whisper-s3/build/firmware.ota.bin fw/heatwhisper_esp32_s3_rs485.ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fw/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: dist }
      # Stable aliases alongside the raw ESPHome outputs (manifest.json + web flasher use these).
      - run: |
          cp dist/firmware.factory.bin dist/heatwhisper_esp32.factory.bin
          cp dist/firmware.ota.bin dist/heatwhisper_esp32.ota.bin
          cp dist/firmware.bin dist/heatwhisper_pico_w.bin
          cp dist/firmware.uf2 dist/heatwhisper_pico_w.uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          prerelease: ${{ contains(github.ref, '-beta') }}
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: fw }
      # Stamp web-flasher manifest version from the git tag (v1.2.3 → 1.2.3)
      # so ESP Web Tools offers updates instead of serving stale 0.1.0.
      - run: |
          TAG=${GITHUB_REF##*/}; VERSION=${TAG#v}; DEST=public; case "$TAG" in *-beta*) DEST=public/beta;; esac
          python3 -c "import json; v='$VERSION'; m=json.load(open('manifest.json')); m['version']=v; json.dump(m,open('manifest.json','w'),indent=2)"
          echo "TAG=$TAG VERSION=$VERSION DEST=$DEST" >> $GITHUB_ENV
      - run: |
          mkdir -p "$DEST"
          cp index.html manifest.json "$DEST"/
          cp fw/firmware.factory.bin "$DEST"/heatwhisper_esp32.factory.bin
          cp fw/firmware.ota.bin "$DEST"/heatwhisper_esp32.ota.bin
          cp fw/firmware.bin "$DEST"/heatwhisper_pico_w.bin
          cp fw/firmware.uf2 "$DEST"/heatwhisper_pico_w.uf2
          cp fw/heatwhisper_esp32_s3_rs485.factory.bin fw/heatwhisper_esp32_s3_rs485.ota.bin "$DEST"/
      # Compose both channels so one Pages deploy never wipes the other.
      - run: |
          if case "$TAG" in *-beta*) true;; *) false;; esac; then
            COUNTER=$(gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            OTHER=public
          else
            COUNTER=$(gh release list --exclude-drafts -L 50 --json tagName,isPrerelease -q '[.[].tagName | select(test("-beta"))][0]' 2>/dev/null || true)
            OTHER=public/beta
          fi
          if [ -n "$COUNTER" ]; then
            gh release download "$COUNTER" -D /tmp/other -p 'heatwhisper_*' || true
            mkdir -p "$OTHER"
            cp /tmp/other/heatwhisper_* "$OTHER"/ || true
            OTHER="$OTHER" CVERSION="${COUNTER#v}" python3 -c "import json,os; o=os.environ['OTHER']; m=json.load(open('manifest.json')); m['version']=os.environ['CVERSION']; json.dump(m,open(o+'/manifest.json','w'),indent=2)"
            cp index.html "$OTHER"/ || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
