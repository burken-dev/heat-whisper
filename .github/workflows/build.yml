name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: python -m pytest tests/ -v
  compile:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # tags must reach git describe for HW_FW_VERSION
      # ponytail: factory image is zero-config (no secrets); keep a dummy file
      # only so local `!secret` experiments don't fail on missing file.
      - run: cp secrets.yaml.example secrets.yaml || true
      - run: pip install -r requirements.txt
      - run: |
          MANIFEST_URL=https://burken-dev.github.io/heat-whisper/manifest.json
          case "${GITHUB_REF:-}" in *-beta*) MANIFEST_URL=https://burken-dev.github.io/heat-whisper/beta/manifest.json;; esac
          # esphome.project.version must equal the manifest "version" (tag minus 'v'), or the
          # HA update entity never clears. Non-tag builds keep the "dev" default from base.yaml.
          FW_VERSION=dev
          case "${GITHUB_REF:-}" in refs/tags/v*) FW_VERSION="${GITHUB_REF#refs/tags/v}";; esac
          ARGS=(-s ota_manifest_url "$MANIFEST_URL" -s fw_version "$FW_VERSION")
          esphome "${ARGS[@]}" config heatwhisper_esp32.yaml
          esphome "${ARGS[@]}" config heatwhisper_pico_w.yaml
          esphome "${ARGS[@]}" config heatwhisper_esp32_s3_rs485.yaml
          esphome "${ARGS[@]}" compile heatwhisper_esp32.yaml
          esphome "${ARGS[@]}" compile heatwhisper_pico_w.yaml
          esphome "${ARGS[@]}" compile heatwhisper_esp32_s3_rs485.yaml
      - run: |
          mkdir -p fw
          cp .esphome/build/heat-whisper/build/firmware.factory.bin fw/
          cp .esphome/build/heat-whisper/build/firmware.ota.bin fw/
          cp .esphome/build/heat-whisper-pico/.pioenvs/heat-whisper-pico/firmware.bin fw/
          cp .esphome/build/heat-whisper-pico/.pioenvs/heat-whisper-pico/firmware.uf2 fw/
      - run: |
          cp .esphome/build/heat-whisper-s3/build/firmware.factory.bin fw/heatwhisper_esp32_s3_rs485.factory.bin
          cp .esphome/build/heat-whisper-s3/build/firmware.ota.bin fw/heatwhisper_esp32_s3_rs485.ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fw/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: firmware, path: dist }
      # Stable aliases alongside the raw ESPHome outputs (manifest.json + web flasher use these).
      - run: |
          cp dist/firmware.factory.bin dist/heatwhisper_esp32.factory.bin
          cp dist/firmware.ota.bin dist/heatwhisper_esp32.ota.bin
          cp dist/firmware.bin dist/heatwhisper_pico_w.bin
          cp dist/firmware.uf2 dist/heatwhisper_pico_w.uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          prerelease: ${{ contains(github.ref, '-beta') }}
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: firmware, path: fw }
      # Stamp web-flasher/OTA manifest from the git tag (v1.2.3 → 1.2.3) so ESP Web Tools and
      # the device update entity see a real version. scripts/stamp_manifest.py derives each
      # channel's ota path + md5 from that channel's own binaries (repo manifest.json stays pristine).
      - run: |
          TAG=${GITHUB_REF##*/}; VERSION=${TAG#v}; DEST=public; case "$TAG" in *-beta*) DEST=public/beta;; esac
          BASE=https://burken-dev.github.io/heat-whisper
          if [ "$DEST" = "public/beta" ]; then BASE="$BASE/beta"; fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DEST=$DEST" >> $GITHUB_ENV
          echo "BASE=$BASE" >> $GITHUB_ENV
      - run: |
          mkdir -p "$DEST"
          cp index.html "$DEST"/
          cp fw/firmware.factory.bin "$DEST"/heatwhisper_esp32.factory.bin
          cp fw/firmware.ota.bin "$DEST"/heatwhisper_esp32.ota.bin
          cp fw/firmware.bin "$DEST"/heatwhisper_pico_w.bin
          cp fw/firmware.uf2 "$DEST"/heatwhisper_pico_w.uf2
          cp fw/heatwhisper_esp32_s3_rs485.factory.bin fw/heatwhisper_esp32_s3_rs485.ota.bin "$DEST"/
          python3 scripts/stamp_manifest.py manifest.json "$DEST/manifest.json" "$VERSION" "$BASE" "$DEST"
      # Compose both channels so one Pages deploy never wipes the other.
      - run: |
          if case "$TAG" in *-beta*) true;; *) false;; esac; then
            COUNTER=$(gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName // empty' 2>/dev/null || true)
            OTHER=public
            OTHER_BASE=https://burken-dev.github.io/heat-whisper
          else
            COUNTER=$(gh release list --exclude-drafts -L 50 --json tagName,isPrerelease -q '[.[].tagName | select(test("-beta"))][0] // empty' 2>/dev/null || true)
            OTHER=public/beta
            OTHER_BASE=https://burken-dev.github.io/heat-whisper/beta
          fi
          if [ "$COUNTER" = "null" ]; then COUNTER=; fi
          if [ -n "$COUNTER" ] && [ "$COUNTER" != "null" ]; then
            gh release download "$COUNTER" -D /tmp/other -p 'heatwhisper_*' || true
            if compgen -G "/tmp/other/heatwhisper_*" > /dev/null; then
              mkdir -p "$OTHER"
              cp /tmp/other/heatwhisper_* "$OTHER"/
              python3 scripts/stamp_manifest.py manifest.json "$OTHER/manifest.json" "${COUNTER#v}" "$OTHER_BASE" "$OTHER"
              cp index.html "$OTHER"/
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v5
