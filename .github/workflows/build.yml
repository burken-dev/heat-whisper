name: build
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: python -m pytest tests/ -v
  compile:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - run: cp secrets.yaml.example secrets.yaml
      - run: pip install esphome
      - run: esphome config nibe_esp32.yaml
      - run: esphome config nibe_pico_w.yaml
      - run: esphome compile nibe_esp32.yaml
      - run: esphome compile nibe_pico_w.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .esphome/build/nibe-bridge/build/firmware.factory.bin
            .esphome/build/nibe-bridge/build/firmware.ota.bin
            .esphome/build/nibe-bridge-pico/.pioenvs/nibe-bridge-pico/firmware.bin
            .esphome/build/nibe-bridge-pico/.pioenvs/nibe-bridge-pico/firmware.uf2
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: dist }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/** }
