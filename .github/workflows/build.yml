name: build
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: python -m pytest tests/ -v
  compile:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - run: cp secrets.yaml.example secrets.yaml
      - run: |
          KEY=$(python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())")
          sed -i "s|^api_key: .*|api_key: \"$KEY\"|" secrets.yaml
      - run: pip install esphome
      - run: esphome config heatwhisper_esp32.yaml
      - run: esphome config heatwhisper_pico_w.yaml
      - run: esphome config heatwhisper_esp32_s3_rs485.yaml
      - run: esphome compile heatwhisper_esp32.yaml
      - run: esphome compile heatwhisper_pico_w.yaml
      - run: esphome compile heatwhisper_esp32_s3_rs485.yaml
      - run: |
          mkdir -p fw
          cp .esphome/build/heat-whisper/build/firmware.factory.bin fw/
          cp .esphome/build/heat-whisper/build/firmware.ota.bin fw/
          cp .esphome/build/heat-whisper-pico/.pioenvs/heat-whisper-pico/firmware.bin fw/
          cp .esphome/build/heat-whisper-pico/.pioenvs/heat-whisper-pico/firmware.uf2 fw/
      - run: |
          cp .esphome/build/heat-whisper-s3/build/firmware.factory.bin fw/heatwhisper_esp32_s3_rs485.factory.bin
          cp .esphome/build/heat-whisper-s3/build/firmware.ota.bin fw/heatwhisper_esp32_s3_rs485.ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fw/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: dist }
      # Stable aliases alongside the raw ESPHome outputs (manifest.json + web flasher use these).
      - run: |
          cp dist/firmware.factory.bin dist/heatwhisper_esp32.factory.bin
          cp dist/firmware.ota.bin dist/heatwhisper_esp32.ota.bin
          cp dist/firmware.bin dist/heatwhisper_pico_w.bin
          cp dist/firmware.uf2 dist/heatwhisper_pico_w.uf2
      - uses: softprops/action-gh-release@v2
        with: { files: dist/** }
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: compile
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: firmware, path: fw }
      - run: |
          mkdir -p public
          cp index.html manifest.json public/
          cp fw/firmware.factory.bin public/heatwhisper_esp32.factory.bin
          cp fw/firmware.ota.bin public/heatwhisper_esp32.ota.bin
          cp fw/firmware.bin public/heatwhisper_pico_w.bin
          cp fw/firmware.uf2 public/heatwhisper_pico_w.uf2
          cp fw/heatwhisper_esp32_s3_rs485.factory.bin public/heatwhisper_esp32_s3_rs485.factory.bin
          cp fw/heatwhisper_esp32_s3_rs485.ota.bin public/heatwhisper_esp32_s3_rs485.ota.bin
      - uses: actions/upload-pages-artifact@v4
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
