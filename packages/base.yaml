# cp secrets.yaml.example secrets.yaml at repo root on first use
esphome:
  on_boot:
    priority: -100
    then:
      - lambda: 'id(nibe_bridge).set_register_enabled(40004, id(en_40004).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40008, id(en_40008).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40012, id(en_40012).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40013, id(en_40013).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40014, id(en_40014).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43009, id(en_43009).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43136, id(en_43136).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43005, id(en_43005).state);'
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Nibe-Bridge"
    password: "nibebridge"
captive_portal:
web_server:
  port: 80
api:
logger:
  baud_rate: 0

# Nibe heat-pump bridge. Native API is primary; MQTT is opt-in only (see bottom).
nibe:
  id: nibe_bridge
  uart_id: nibe_uart
  # Bring-up order: flash with passive: true first, confirm decode in
  # logs/web_server, then enable TX (passive: false).
  # passive: true
  # extra_poll: [10001]  # optional poll-without-entity (bring-up sniffing)
  # WARNING: writes to addr <20000 (RMU 1xxxx range) are dropped, never sent in the 0x6B slot.
  # flow_control_pin: GPIO18  # optional RS485 auto-direction pin (absent = no direction control)
  # Entities below auto-poll their registers — no separate poll list to keep in sync.

sensor:
  # Anti-spam contract (§4): every entity carries delta/throttle/heartbeat so
  # the pump's broadcast storm stays off the network. Copy this filter block
  # onto any register you add.
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40004
    name: "BT1 Outdoor"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40008
    name: "Supply Temp S1"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40012
    name: "Return Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40013
    name: "Hot Water Top BT7"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40014
    name: "Hot Water BT6"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43009
    name: "Calculated Supply"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43136
    name: "Compressor Frequency"
    unit_of_measurement: "Hz"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  # Opt-in example (allowlisted + polled, no default entity — uncomment to add):
  # - platform: nibe
  #   nibe_id: nibe_bridge
  #   register: 10001
  #   name: "Alarm"
  #   accuracy_decimals: 0
  #   filters:
  #     - delta: 0.1
  #     - throttle: 60s
  #     - heartbeat: 5min

number:
  # Writable regs: HA traits (min/max/step, scaled units) + firmware
  # clamps raw writes to the merged NIBE_COMMON min/max before queue_write.
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43005
    name: "Degree Minutes"
    min_value: -3000
    max_value: 3000
    step: 10

switch:
  - platform: template
    name: "Enable BT1 Outdoor"
    id: en_40004
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(40004, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(40004, false);' }
  - platform: template
    name: "Enable Supply S1"
    id: en_40008
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(40008, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(40008, false);' }
  - platform: template
    name: "Enable Return"
    id: en_40012
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(40012, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(40012, false);' }
  - platform: template
    name: "Enable Hot Water Top"
    id: en_40013
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(40013, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(40013, false);' }
  - platform: template
    name: "Enable Hot Water BT6"
    id: en_40014
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(40014, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(40014, false);' }
  - platform: template
    name: "Enable Calculated Supply"
    id: en_43009
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(43009, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(43009, false);' }
  - platform: template
    name: "Enable Compressor Freq"
    id: en_43136
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(43136, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(43136, false);' }
  - platform: template
    name: "Enable Degree Minutes"
    id: en_43005
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(43005, true);' }
    turn_off_action: { lambda: 'id(nibe_bridge).set_register_enabled(43005, false);' }

# MQTT opt-in (OFF by default). Add a broker block and each entity above
# publishes to its single native state topic (<node>/sensor/<name>/state)
# automatically — no extra config, and never the reference bridge's
# /json + /raw triple-topic spam.
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_user
#   password: !secret mqtt_password
