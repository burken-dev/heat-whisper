# cp secrets.yaml.example secrets.yaml at repo root on first use
esphome:
  on_boot:
    priority: -100
    then:
      - lambda: 'id(nibe_bridge).set_register_enabled(40004, id(en_40004).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40008, id(en_40008).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40012, id(en_40012).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40013, id(en_40013).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40014, id(en_40014).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43009, id(en_43009).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43136, id(en_43136).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43005, id(en_43005).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(40033, id(en_40033).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43144, id(en_43144).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(43305, id(en_43305).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47011, id(en_47011).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47007, id(en_47007).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47041, id(en_47041).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47371, id(en_47371).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47370, id(en_47370).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47387, id(en_47387).state);'
      - lambda: 'id(nibe_bridge).set_register_enabled(47043, id(en_47043).state);'
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  power_save_mode: none
  ap:
    ssid: "Nibe-Bridge"
    password: !secret ap_password
captive_portal:
web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
safe_mode:
logger:
  baud_rate: 0

# Nibe heat-pump bridge. Native API is primary; MQTT is opt-in only (see bottom).
nibe:
  id: nibe_bridge
  uart_id: nibe_uart
  # Bring-up order: flash with passive: true first, confirm decode in
  # logs/web_server, then enable TX (passive: false).
  # passive: true
  # extra_poll: [10001]  # optional poll-without-entity (bring-up sniffing)
  # WARNING: writes to addr <20000 (RMU 1xxxx range) are dropped, never sent in the 0x6B slot.
  # flow_control_pin: GPIO18  # optional RS485 auto-direction pin (absent = no direction control)
  # Entities below auto-poll their registers — no separate poll list to keep in sync.

sensor:
  # Anti-spam contract (§4): every entity carries delta/throttle/heartbeat so
  # the pump's broadcast storm stays off the network. Copy this filter block
  # onto any register you add.
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40004
    name: "BT1 Outdoor"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40008
    name: "Supply Temp S1"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40012
    name: "Return Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40013
    name: "Hot Water Top BT7"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40014
    name: "Hot Water BT6"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43009
    name: "Calculated Supply"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43136
    name: "Compressor Frequency"
    unit_of_measurement: "Hz"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 40033
    name: "Room Temp S1"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43144
    name: "Compressor Energy Total"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43305
    name: "Compressor Energy HW"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    filters:
      - delta: 0.1
      - throttle: 60s
      - heartbeat: 5min
  # Opt-in example (allowlisted + polled, no default entity — uncomment to add):
  # - platform: nibe
  #   nibe_id: nibe_bridge
  #   register: 10001
  #   name: "Alarm"
  #   accuracy_decimals: 0
  #   filters:
  #     - delta: 0.1
  #     - throttle: 60s
  #     - heartbeat: 5min

number:
  # Writable regs: HA traits (min/max/step, scaled units) + firmware
  # clamps raw writes to the merged NIBE_COMMON min/max before queue_write.
  - platform: nibe
    nibe_id: nibe_bridge
    register: 43005
    name: "Degree Minutes"
    min_value: -3000
    max_value: 3000
    step: 10
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47011
    name: "Heat Offset S1"
    min_value: -10
    max_value: 10
    step: 1
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47007
    name: "Heat Curve S1"
    min_value: 0
    max_value: 15
    step: 1
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47041
    name: "Hot Water Comfort Mode"
    min_value: 0
    max_value: 4
    step: 1
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47371
    name: "Allow Heating"
    min_value: 0
    max_value: 1
    step: 1
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47370
    name: "Allow Additive Heating"
    min_value: 0
    max_value: 1
    step: 1
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47387
    name: "Hot Water Production"
    min_value: 0
    max_value: 1
    step: 1
  - platform: nibe
    nibe_id: nibe_bridge
    register: 47043
    name: "Hot Water Luxury Start Temp"
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 70
    step: 0.5

text_sensor:
  # Autodetected from the pump's 0x6D announcement (empty = not heard yet).
  - platform: template
    name: "Heat Pump Model"
    lambda: 'return id(nibe_bridge).get_model();'
    update_interval: 60s
    entity_category: diagnostic

switch:
  - platform: template
    name: "Enable BT1 Outdoor"
    id: en_40004
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: { lambda: 'id(nibe_bridge).set_register_enabled(40004, true);' }
