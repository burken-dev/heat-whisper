# cp secrets.yaml.example secrets.yaml at repo root on first use
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  power_save_mode: none
  ap:
    ssid: "HeatWhisper"
    password: !secret ap_password
captive_portal:
web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
safe_mode:
logger:
  baud_rate: 0

# HeatWhisper. Native API is primary; MQTT is opt-in only (see bottom).
heatwhisper:
  id: heatwhisper_bridge
  uart_id: heatwhisper_uart
  # Registers are now picked at runtime: open http://<node>/heatwhisper/registers,
  # check what to expose (max 50), save, reboot. Entity types auto-inferred
  # (R→sensor, R/W→number, curated switches/selects). Factory defaults =
  # 18 entities; stored in flash, survives OTA.
  # Bring-up order: flash with passive: true first, confirm decode in
  # logs/web_server, then enable TX (passive: false).
  # passive: true
  # extra_poll: [10001]  # optional poll-without-entity (bring-up sniffing)
  # WARNING: writes to addr <20000 (RMU 1xxxx range) are dropped, never sent in the 0x6B slot.
  # flow_control_pin: GPIO18  # optional RS485 auto-direction pin (absent = no direction control)
  # Modbus-RTU mode (non-Nibe, or Nibe via MODBUS40 accessory):
  #   protocol: modbus_rtu
  #   model: F750        # required in modbus mode (Nibe maps double as MODBUS40 maps)
  #   modbus_address: 1  # peer address

text_sensor:
  # Autodetected from the pump's 0x6D announcement (empty = not heard yet).
  - platform: template
    name: "Heat Pump Model"
    lambda: 'return id(heatwhisper_bridge).get_model();'
    update_interval: 60s
    entity_category: diagnostic

# MQTT opt-in (OFF by default). Add a broker block and each entity above
# publishes to its single native state topic (<node>/sensor/<name>/state)
# automatically — no extra config.
# Custom topic prefix: topic_prefix: "heatwhisper" (default is <node name>).
# HA discovery is automatic when mqtt: is present; set discovery: false to disable.
# mqtt:
#   broker: !secret mqtt_broker
#   username: !secret mqtt_user
#   password: !secret mqtt_password
#   topic_prefix: "heatwhisper"
#   discovery: true
